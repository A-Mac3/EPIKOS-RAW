[workspace]
resolver = "2"
members = [
    "crates/epikos-core",
    "crates/epikos-decode",
    "crates/epikos-pipeline",
    "crates/epikos-sidecar",
    "crates/epikos-engine",
    "crates/epikos-cli",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["EPIKOS"]
repository = "https://github.com/epikos/epikos-raw"

[workspace.dependencies]
epikos-core = { path = "crates/epikos-core" }
epikos-decode = { path = "crates/epikos-decode" }
epikos-pipeline = { path = "crates/epikos-pipeline" }
epikos-sidecar = { path = "crates/epikos-sidecar" }
epikos-engine = { path = "crates/epikos-engine" }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
sha2 = "0.10"
hex = "0.4"
clap = { version = "4", features = ["derive"] }
rawler = "0.8"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
