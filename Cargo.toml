[workspace]
resolver = "2"
members = [
    "crates/epikos-core",
    "crates/epikos-decode",
    "crates/epikos-pipeline",
    "crates/epikos-sidecar",
    "crates/epikos-engine",
    "crates/epikos-masks",
    "crates/epikos-cli",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["EPIKOS"]
repository = "https://github.com/epikos/epikos-raw"

[workspace.dependencies]
epikos-core = { path = "crates/epikos-core" }
epikos-decode = { path = "crates/epikos-decode" }
epikos-pipeline = { path = "crates/epikos-pipeline" }
epikos-sidecar = { path = "crates/epikos-sidecar" }
epikos-engine = { path = "crates/epikos-engine" }
epikos-masks = { path = "crates/epikos-masks" }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
sha2 = "0.10"
hex = "0.4"
clap = { version = "4", features = ["derive"] }
rawler = "0.8"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

# Dev builds (incl. `tauri dev`): optimise the image engine and all dependencies so
# decoding and previews run at near-release speed; the app shell keeps fast debug builds.
[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.epikos-core]
opt-level = 3

[profile.dev.package.epikos-decode]
opt-level = 3

[profile.dev.package.epikos-pipeline]
opt-level = 3

[profile.dev.package.epikos-engine]
opt-level = 3
